# CIRCL requires Go 1.25 or newer, see go.mod.
image: golang:1.25

stages:
  - check
  - test
  - deploy

variables:
  GOPATH: $CI_PROJECT_DIR/.gocache/go
  GOMODCACHE: $CI_PROJECT_DIR/.gocache/mod
  GOFLAGS: -mod=readonly

cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/

.go-base:
  before_script:
    - go version
    - go mod download

# main only receives merges from develop (README.md "Branching model") — enforced here rather
# than left to convention, since branch protection alone cannot restrict where a merge request's
# source branch comes from.
guard-main-source:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "main only accepts merges from develop, not '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'."
        exit 1
      fi

build:
  extends: .go-base
  stage: check
  script:
    - go build ./...

format:
  extends: .go-base
  stage: check
  script:
    - |
      files=$(git ls-files '*.go')
      if [ -n "$files" ] && [ -n "$(gofmt -l $files)" ]; then
        gofmt -d $files
        echo 'gofmt deviations, see above'
        exit 1
      fi

vet:
  extends: .go-base
  stage: check
  script:
    - go vet ./...

staticcheck:
  extends: .go-base
  stage: check
  script:
    - go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

test:
  extends: .go-base
  stage: test
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

# Short fuzz run per pipeline. Deserialization is the only place where
# foreign bytes enter the system — that is where it pays off to look for
# inputs nobody would come up with by hand.
#
# -parallel=2: on a CPU-throttled shared runner, GOMAXPROCS-many fuzz
# workers (the default) compete for cgroup CPU quota they don't actually
# have, and a worker that doesn't check in with the coordinator in time
# makes the whole run fail with "context deadline exceeded" — not a found
# crasher, just a starved worker. Capping parallelism gives each worker a
# real shot at its share of fuzztime instead of thrashing.
# retry: covers the same flake as a last resort. A genuine crashing input
# fails differently (a specific panic plus a persisted testdata/fuzz/...
# file) and reproduces identically on retry, so this can't hide a real bug.
fuzz-smoke:
  extends: .go-base
  stage: test
  retry: 2
  script:
    - go test ./core/ -run '^$' -fuzz FuzzParseEntry -fuzztime 60s -parallel=2
    - go test ./core/ -run '^$' -fuzz FuzzParseSignedEntry -fuzztime 60s -parallel=2
    # Leaves and STHs come from foreign nodes and are therefore the same
    # kind of input as an entry.
    - go test ./log/ -run '^$' -fuzz FuzzParseLeaf -fuzztime 30s -parallel=2
    - go test ./log/ -run '^$' -fuzz FuzzParseSTH -fuzztime 30s -parallel=2
    - go test ./log/ -run '^$' -fuzz FuzzParseSignedSTH -fuzztime 30s -parallel=2
  allow_failure: false

# Deploy: develop -> owm-dev, main -> owm-community, matching README.md's
# "Branching model". Uploads as a .new file and mv's it into place — mv
# within the same filesystem is atomic, so a service restart never catches
# a half-written binary. The remote user is owmnode; the restart itself
# goes through a narrowly scoped sudoers rule (owmnode may run exactly
# `systemctl restart owmnode.service` and nothing else), not a broader sudo
# grant.
.deploy-base:
  image: golang:1.25
  stage: deploy
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    # SSH_PRIVATE_KEY is a plain multi-line Variable (not File, not Masked —
    # GitLab refuses to mask any value containing whitespace, which a key
    # always has). printf, not echo: some /bin/sh implementations give echo
    # its own opinions about backslashes and trailing newlines, printf '%s'
    # does not. tr strips \r in case of a Windows-style paste. ssh-keygen
    # -y then validates the result BEFORE ssh-add ever sees it — a bad
    # variable fails here with an actual diagnostic (byte count, and the
    # first line, which for a real key is only public boilerplate like
    # "-----BEGIN OPENSSH PRIVATE KEY-----") instead of OpenSSL's opaque
    # "error in libcrypto".
    - printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - |
        if ! ssh-keygen -y -f /tmp/deploy_key > /dev/null 2>&1; then
          echo "SSH_PRIVATE_KEY does not parse as a valid private key."
          echo "length: $(wc -c < /tmp/deploy_key) bytes, lines: $(wc -l < /tmp/deploy_key)"
          echo "first line (boilerplate only, not secret):"
          head -n1 /tmp/deploy_key
          echo "last line (boilerplate only, not secret):"
          tail -n1 /tmp/deploy_key
          exit 1
        fi
    - ssh-add /tmp/deploy_key
    - rm -f /tmp/deploy_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$OWM_HOST" >> ~/.ssh/known_hosts
  script:
    - GOOS=linux GOARCH=amd64 go build -o owmnode ./node/cmd/owmnode
    - scp owmnode "owmnode@$OWM_HOST:/opt/openwaymark/bin/owmnode.new"
    - ssh "owmnode@$OWM_HOST" "mv /opt/openwaymark/bin/owmnode.new /opt/openwaymark/bin/owmnode && chmod +x /opt/openwaymark/bin/owmnode && sudo systemctl restart owmnode.service"

# Automatic: every push to develop that passes check/test deploys to
# owm-dev right away, no button to press. $CI_COMMIT_BRANCH is unset on a
# tag pipeline, so this never fires for a tag by itself.
deploy-dev:
  extends: .deploy-base
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    OWM_HOST: $OWM_DEV_HOST

# Manual and tag-gated: the deploy button only exists on a tag pipeline
# (a release), and even then has to be clicked — a push to main by itself
# deploys nothing. GitLab only shows/allows the button once every job in an
# earlier stage has succeeded, so this can't jump ahead of check/test.
deploy-community:
  extends: .deploy-base
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  variables:
    OWM_HOST: $OWM_COMMUNITY_HOST
