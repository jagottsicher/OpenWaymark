# CIRCL requires Go 1.25 or newer, see go.mod.
image: golang:1.25

stages:
  - check
  - test

variables:
  GOPATH: $CI_PROJECT_DIR/.gocache/go
  GOMODCACHE: $CI_PROJECT_DIR/.gocache/mod
  GOFLAGS: -mod=readonly

cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/

.go-base:
  before_script:
    - go version
    - go mod download

# CLAUDE.md is project-internal working notes, deliberately never committed
# (it was purged from history on 2026-08-17/18) — .gitignore keeps an
# ordinary "git add ." from picking it back up, this catches an explicit
# "git add -f" or a fresh commit made without the ignore file in place.
guard-no-claude-md:
  stage: check
  script:
    - |
      if git ls-files --error-unmatch CLAUDE.md >/dev/null 2>&1; then
        echo "CLAUDE.md must never be committed to this repository — see .gitignore."
        exit 1
      fi

build:
  extends: .go-base
  stage: check
  script:
    - go build ./...

format:
  extends: .go-base
  stage: check
  script:
    - |
      files=$(git ls-files '*.go')
      if [ -n "$files" ] && [ -n "$(gofmt -l $files)" ]; then
        gofmt -d $files
        echo 'gofmt deviations, see above'
        exit 1
      fi

vet:
  extends: .go-base
  stage: check
  script:
    - go vet ./...

staticcheck:
  extends: .go-base
  stage: check
  script:
    - go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

test:
  extends: .go-base
  stage: test
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

# Short fuzz run per pipeline. Deserialization is the only place where
# foreign bytes enter the system — that is where it pays off to look for
# inputs nobody would come up with by hand.
fuzz-smoke:
  extends: .go-base
  stage: test
  script:
    - go test ./core/ -run '^$' -fuzz FuzzParseEntry -fuzztime 60s
    - go test ./core/ -run '^$' -fuzz FuzzParseSignedEntry -fuzztime 60s
    # Leaves and STHs come from foreign nodes and are therefore the same
    # kind of input as an entry.
    - go test ./log/ -run '^$' -fuzz FuzzParseLeaf -fuzztime 30s
    - go test ./log/ -run '^$' -fuzz FuzzParseSTH -fuzztime 30s
    - go test ./log/ -run '^$' -fuzz FuzzParseSignedSTH -fuzztime 30s
    # A TXT record's origin is not authenticated absent DNSSEC — the one other
    # place foreign bytes are parsed by hand.
    - go test ./discovery/ -run '^$' -fuzz FuzzParseRecord -fuzztime 15s
  allow_failure: false
