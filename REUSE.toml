version = 1
SPDX-PackageName = "OpenWaymark"
SPDX-PackageSupplier = "OpenWaymark contributors"
SPDX-PackageDownloadLocation = "https://openwaymark.org/"

# Standardlizenz des Repositorys. Bereiche mit abweichender Lizenz werden weiter
# unten überschrieben; die spätere Regel gewinnt.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "Apache-2.0"

# Serverkomponenten stehen unter AGPL-3.0, damit Betreiber ihre Änderungen
# an das Netz zurückgeben, in dem sie sie einsetzen.
[[annotations]]
path = ["node/**", "monitor/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Testvektoren sind Teil der Spezifikation und sollen von Fremdimplementierungen
# ohne Auflagen übernommen werden können.
[[annotations]]
path = "testdata/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "Apache-2.0"
