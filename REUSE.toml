version = 1
SPDX-PackageName = "OpenWaymark"
SPDX-PackageSupplier = "OpenWaymark contributors"
SPDX-PackageDownloadLocation = "https://openwaymark.org/"

# Default license of the repository. Sections with a different license are
# overridden further down; the later rule wins.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "Apache-2.0"

# Server components are licensed under AGPL-3.0 so that operators give their
# changes back to the network they run them in.
[[annotations]]
path = ["node/**", "monitor/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Test vectors are part of the specification and are meant to be reusable by
# third-party implementations without conditions.
[[annotations]]
path = "testdata/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenWaymark contributors"
SPDX-License-Identifier = "Apache-2.0"
